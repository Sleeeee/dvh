name: Run tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./firmware

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install build dependencies # Contains gcc, standard C libraries and code coverage utility
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lcov

      - name: Run Unity tests
        run: |
          chmod u+x tests/unit/run_tests.sh
          ./tests/unit/run_tests.sh

  renode-tests:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: ./firmware

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install ARM Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c
        with:
          release: "14.2.Rel1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-avr binutils-avr avr-libc

      - name: Build Firmware
        run: |
          cmake -B build_simulation -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake -DSIMULATION=ON
          cmake --build build_simulation

      - name: Run Renode tests
        uses: antmicro/renode-test-action@0705567acf04d7b998d7deac1e05d9067d70d901
        with:
          tests-to-run: firmware/tests/renode/src/*.robot
          renode-revision: "v1.16.1"
